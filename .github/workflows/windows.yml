name: Windows checks and portable build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install development environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "venv failed" }
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "pip failed" }

      - name: Fetch fixed FFmpeg build with SHA256 verification
        run: |
          $ffmpegOutput = @(.\scripts\fetch_ffmpeg.ps1)
          $ffmpegBin = $ffmpegOutput[-1]
          if (-not (Test-Path -LiteralPath (Join-Path $ffmpegBin "ffmpeg.exe"))) { throw "FFmpeg missing" }
          "BILI_MP4_FFMPEG_DIR=$ffmpegBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Python syntax
        run: |
          .\.venv\Scripts\python.exe -m compileall -q src tests scripts
          if ($LASTEXITCODE -ne 0) { throw "compileall failed" }

      - name: Run automated tests with mocks and localhost HTTP
        run: |
          .\.venv\Scripts\python.exe -m pytest --junitxml=build/test-results.xml
          if ($LASTEXITCODE -ne 0) { throw "pytest failed" }

      - name: Smoke test source GUI
        run: |
          .\.venv\Scripts\python.exe -m bili_mp4 --smoke-test --data-dir .\build\source-smoke-data
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed" }

      - name: Build portable Windows x64 package
        run: |
          .\scripts\build_windows.ps1 -FfmpegDirectory $env:BILI_MP4_FFMPEG_DIR

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-report
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload portable test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BiliMP4-windows-x64
          path: |
            dist/BiliMP4-*-windows-x64.zip
            dist/BiliMP4-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
